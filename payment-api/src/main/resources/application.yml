server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: payment-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:payment_switch}
    username: ${PG_USERNAME:payment}
    password: ${PG_PASSWORD:payment}
    hikari:
      maximum-pool-size: ${PG_POOL_SIZE:20}
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: payment-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        enable.auto.commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Tüm replikalar yazmadan onay verilmez; broker düşerse mesaj kaybolmaz
      acks: all
      properties:
        # Producer retry'ında broker aynı mesajı iki kez yazmaz, partition içi sıra korunur
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        # Kafka kapalıyken send() metadata için 60 sn bloklamasın; relay DB kilidini uzun tutmasın
        max.block.ms: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis takılırsa ödeme isteği beklemesin, kısa sürede fail-open ile DB'ye düşülsün
      timeout: 300ms
      connect-timeout: 500ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bartugsevindik.paymentswitch: ${LOG_LEVEL:INFO}
    # Idempotency çakışmasında beklenen unique constraint hatasını ERROR olarak basıyor. Exception yine fırlatılıyor.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

application:
  idempotency:
    record-ttl: ${IDEMPOTENCY_RECORD_TTL:24h}
    lock-ttl: ${IDEMPOTENCY_LOCK_TTL:10s}
    hash-secret: ${IDEMPOTENCY_HASH_SECRET:local-dev-secret-change-me}
    cleanup-cron: "0 */10 * * * *"
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:200ms}
    batch-size: 100
    send-timeout: 5s
    retention: 7d
  kafka:
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:6}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
  reconciliation:
    # Gerçekte her bankanın SFTP / API adresi; lokalde simülatör
    bank-file-base-url: ${BANK_FILE_BASE_URL:http://localhost:8090}
    date-tolerance-days: 1
    cron: "0 0 3 * * *"
  ledger:
    # Üye işyeri tanımlı değilse uygulanan komisyon (baz puan)
    default-commission-rate-bps: 249
  payment-operation:
    # Bu saatten sonra o günün ödemeleri iptal edilemez, sadece iade edilebilir
    business-day-cutoff: ${BUSINESS_DAY_CUTOFF:23:30}
    business-zone: Europe/Istanbul
  webhook:
    poll-interval: ${WEBHOOK_POLL_INTERVAL:1s}
    connect-timeout: 2s
    read-timeout: 5s
    retry-schedule: 10s,30s,2m,10m,30m,1h,3h,6h
  card-vault:
    ttl: ${CARD_VAULT_TTL:15m}
    # Lokal geliştirme değerleri bilerek okunabilir: base64("LOCAL-DEV-ONLY-cardvault-key-001").
    # Gerçek bir anahtar değildir; production profilinde varsayılan yoktur, env verilmezse uygulama açılmaz.
    encryption-key: ${CARD_VAULT_ENCRYPTION_KEY:TE9DQUwtREVWLU9OTFktY2FyZHZhdWx0LWtleS0wMDE=}
    internal-api-token: ${INTERNAL_API_TOKEN:local-dev-only-internal-token}
  terminal-auth:
    timestamp-tolerance: ${TERMINAL_TIMESTAMP_TOLERANCE:5m}
    # base64("LOCAL-DEV-ONLY-terminal-key-0001"). Sadece lokal; production'da KMS/Vault'tan gelir.
    secret-master-key: ${TERMINAL_SECRET_MASTER_KEY:TE9DQUwtREVWLU9OTFktdGVybWluYWwta2V5LTAwMDE=}

---
spring:
  config:
    activate:
      on-profile: production

application:
  idempotency:
    # Production'da varsayılan değer yok, secret verilmezse uygulama açılmaz
    hash-secret: ${IDEMPOTENCY_HASH_SECRET}
  terminal-auth:
    secret-master-key: ${TERMINAL_SECRET_MASTER_KEY}
  card-vault:
    encryption-key: ${CARD_VAULT_ENCRYPTION_KEY}
    internal-api-token: ${INTERNAL_API_TOKEN}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
