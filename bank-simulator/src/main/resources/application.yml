server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: bank-simulator
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bartugsevindik.paymentswitch: ${LOG_LEVEL:INFO}
