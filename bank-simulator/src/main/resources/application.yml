server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: bank-simulator
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # Lokalde her istek izlenir; production'da %1-10 yeterli (TRACING_SAMPLING=0.05)
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bartugsevindik.paymentswitch: ${LOG_LEVEL:INFO}
