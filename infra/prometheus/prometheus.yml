global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

# Servisler lokalde (host üzerinde) çalışıyor; container'dan host'a host.docker.internal ile erişilir.
# Servisler compose ile çalıştırılıyorsa hedefler servis adıyla (payment-api:8081) değiştirilmeli.
scrape_configs:
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8081" ]
  - job_name: routing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8082" ]
  - job_name: bank-adapter
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8083" ]
  - job_name: bank-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8090" ]
